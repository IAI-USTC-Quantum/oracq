name: Docs build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra docs
      - name: Build bilingual docs (warnings as errors)
        run: uv run --frozen python tools/build_docs.py --lang all
      - name: Upload English docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-en
          path: out/docs/en
      - name: Upload Chinese docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-zh
          path: out/docs/zh
