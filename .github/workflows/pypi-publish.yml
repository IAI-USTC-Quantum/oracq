name: Publish Python Package

# Triggered by a tag (v*) or a GitHub Release -> uv builds the
# pure-Python wheel + sdist -> PyPI trusted publishing (OIDC, no
# token; the PyPI side needs a trusted publisher preconfigured for
# environment "pypi": owner=IAI-USTC-Quantum, repo=oracq,
# workflow=pypi-publish.yml).
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    # Gitea also scans .github/workflows, but its runners cannot reach
    # github.com -> run on the GitHub upstream only
    if: github.repository_owner == 'IAI-USTC-Quantum'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      # pyproject.toml pins the version statically -> fail early instead
      # of uploading a release whose version disagrees with the tag
      - name: Verify tag matches package version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if ! ls "dist/oracq-${expected}-py3-none-any.whl" "dist/oracq-${expected}.tar.gz" > /dev/null 2>&1; then
            echo "ERROR: built distributions do not match tag ${GITHUB_REF_NAME} (expected version ${expected})"
            ls dist
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Manual workflow_dispatch runs build only, no publishing
    if: >-
      github.repository_owner == 'IAI-USTC-Quantum' &&
      (github.event_name == 'push' || github.event_name == 'release')
    environment:
      name: pypi
      url: https://pypi.org/project/oracq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
