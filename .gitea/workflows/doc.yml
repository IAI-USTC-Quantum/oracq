name: Docs HTML preview

on:
  push:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Same mirror strategy as python-ci.yml; publishing credentials come from
    # repository secrets PREVIEW_API_BASE / PREVIEW_API_KEY (matching the
    # local html-previewer deployment).
    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple/
      PREVIEW_API_BASE: ${{ secrets.PREVIEW_API_BASE }}
      PREVIEW_API_KEY: ${{ secrets.PREVIEW_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra docs
      - name: Build Chinese docs HTML (warnings as errors)
        run: uv run --frozen python -m sphinx -W --keep-going -b html docs/zh out/docs/zh
      - name: Publish preview
        # Slashes in the branch name become dashes so the topic is a valid
        # URL label; a topic with the same name is updated in place and the
        # preview expires automatically after 30 days without updates.
        run: |
          TOPIC="oracq-docs-$(echo "${{ github.ref_name }}" | tr '/' '-')"
          uv run --frozen --with html-previewer==0.1.1 preview-publish out/docs/zh "$TOPIC" 30
