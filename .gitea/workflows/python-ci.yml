name: Python library checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    # runner 访问 PyPI 慢，pip 与 uv 统一走阿里云镜像；锁文件基于 pypi.org，
    # 与镜像默认源并用时 --locked 会触发一致性报错，故用 --frozen 按锁安装。
    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra dev --extra docs
      - run: uv run --frozen python tools/check_project.py --docs
      - run: uv build
