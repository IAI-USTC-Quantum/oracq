[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oracq"
version = "0.1.0"
description = "Python quantum generators with a modular register-level IR"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "agony", email = "chenzhaoyun@iai.ustc.edu.cn" }]
keywords = ["quantum", "quantum-computing", "quantum-algorithms", "resource-estimation", "compiler", "ir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/IAI-USTC-Quantum/oracq"
Repository = "https://github.com/IAI-USTC-Quantum/oracq"
Issues = "https://github.com/IAI-USTC-Quantum/oracq/issues"
Documentation = "https://iai-ustc-quantum.github.io/oracq/"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "jsonschema>=4.23", "mypy>=1.14", "types-PyYAML>=6"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6", "furo>=2024.8.6", "sphinxcontrib-mermaid>=1,<3"]
[project.scripts]
oracq = "oracq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oracq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "examples"]

[[tool.mypy.overrides]]
module = ["pysparq", "pysparq.*", "uniqc.*"]
ignore_missing_imports = true
