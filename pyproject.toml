[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqecclang"
version = "0.8.0"
description = "Python quantum generators with a modular register-level IR"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "jsonschema>=4.23", "mypy>=1.14"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6", "furo>=2024.8.6", "sphinxcontrib-mermaid>=1,<3"]
[project.scripts]
pyqecclang = "pyqecclang.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyqecclang = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "examples"]

[[tool.mypy.overrides]]
module = ["pysparq", "pysparq.*", "uniqc.*"]
ignore_missing_imports = true
