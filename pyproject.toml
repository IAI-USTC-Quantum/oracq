[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqecclang"
version = "0.6.0"
description = "Python quantum generators with a modular register-level IR"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "jsonschema>=4.23"]
[project.scripts]
pyqecclang = "pyqecclang.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
